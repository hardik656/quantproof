name: CI
on:
  push:
    branches: [main, hireable-upgrade]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}", cache: pip}
      - run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=45
      - name: Render-style startup (repo root, backend.main:app) and backend/ startup
        run: |
          mkdir -p /tmp/qp
          QP_STATE_DIR=/tmp/qp uvicorn backend.main:app --port 8001 & sleep 8
          curl -fs localhost:8001/health
          (cd backend && QP_STATE_DIR=/tmp/qp uvicorn main:app --port 8002 &) ; sleep 8
          curl -fs localhost:8002/health
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with: {name: coverage, path: coverage.xml}

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - run: alembic upgrade head && alembic check
      - name: tests against Postgres
        run: pytest -q tests/test_store.py tests/test_api.py

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t quantproof .
      - name: smoke test
        run: |
          docker run -d --name qp -p 8000:8000 quantproof
          for i in $(seq 1 30); do curl -fs localhost:8000/health && exit 0; sleep 2; done
          docker logs qp; exit 1
