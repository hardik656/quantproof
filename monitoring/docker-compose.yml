# Optional local monitoring stack: Postgres (with the QuantProof schema) + Grafana.
# Not used by production or render.yaml. Run from the repo root:
#   docker compose -f monitoring/docker-compose.yml up --build
# Grafana: http://localhost:3000 (admin / admin). Dashboard: QuantProof > persisted state.
services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: app, POSTGRES_PASSWORD: app, POSTGRES_DB: app}
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 5s
      retries: 10

  migrate:
    build: ..
    working_dir: /app
    command: ["alembic", "upgrade", "head"]
    environment: {DATABASE_URL: "postgresql+psycopg://app:app@db:5432/app"}
    depends_on: {db: {condition: service_healthy}}

  seed:   # optional demo rows so the dashboard isn't empty; skip with --scale seed=0
    image: postgres:16
    command: ["psql", "postgresql://app:app@db:5432/app", "-f", "/seed/demo-data.sql"]
    volumes: ["./demo-data.sql:/seed/demo-data.sql:ro"]
    depends_on: {migrate: {condition: service_completed_successfully}}

  grafana:
    image: grafana/grafana-oss:11.3.0
    ports: ["3000:3000"]
    environment:
      QP_PG_HOST: db:5432
      QP_PG_USER: app
      QP_PG_PASSWORD: app
      QP_PG_DB: app
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: {migrate: {condition: service_completed_successfully}}
