apiVersion: 1
datasources:
  - name: QuantProof Postgres
    uid: qp-postgres
    type: grafana-postgresql-datasource
    url: ${QP_PG_HOST}
    user: ${QP_PG_USER}
    isDefault: true
    jsonData:
      database: ${QP_PG_DB}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${QP_PG_PASSWORD}
